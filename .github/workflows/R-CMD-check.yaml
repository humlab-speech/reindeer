# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master, v0.7-breaking]
  pull_request:
    branches: [main, master, v0.7-breaking]

name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macOS-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,   r: 'release'}
          - {os: ubuntu-latest,   r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # Interim: superassp (GitHub Remotes, git-submodule vendoring) does not
      # build from source on R >= 4.6 or via GitHub source installs. Until it is
      # fixed upstream, check without Suggests and silence the missing-Suggests
      # NOTE. The Suggests needed to run tests/vignettes are installed explicitly
      # below. Revert when humlab-speech/superassp installs cleanly again.
      _R_CHECK_FORCE_SUGGESTS_: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::rcmdcheck
            any::testthat
            any::withr
            any::emuR
            any::dplyr
            any::qs2
            any::ggplot2
            any::openxlsx
            any::knitr
            any::rmarkdown
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          error-on: error
          # --no-vignettes: the vignette-code tangle step sources every chunk,
          # ignoring the REINDEER_EVAL_VIGNETTES gate; chunks need superassp /
          # real corpora and cannot run in this interim check. Vignette knitting
          # is still validated at R CMD build.
          check_args: 'c("--no-vignettes")'
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
