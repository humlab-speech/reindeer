# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Deploys via GitHub Actions Pages (no gh-pages branch needed).
# Requires repo: Settings -> Pages -> Source: "GitHub Actions".
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

permissions:
  contents: read
  pages:    write
  id-token: write

# Allow only one concurrent deployment, but do not cancel in-progress runs.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # eggstract and protoscribe are private repositories and cannot be
          # fetched from CI; every chunk that needs one is gated with
          # requireNamespace(), so the site builds without them. superassp
          # comes from GitHub, and dplyr is the one Suggests the ungated chunks
          # require, so both are installed on top of the hard dependencies to
          # publish the vignettes with real DSP output.
          extra-packages: any::pkgdown, any::knitr, any::rmarkdown, any::dplyr, github::humlab-speech/superassp, local::.
          needs: website
          dependencies: '"hard"'

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
