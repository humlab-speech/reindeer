url: https://humlab-speech.github.io/reindeer/
lang: en

template:
  bootstrap: 5
  bootswatch: flatly
  bslib:
    primary: "#0054AD"
    border-radius: 0.5rem
    btn-border-radius: 0.25rem
  opengraph:
    image:
      src: man/figures/logo.png
      alt: "reindeer: speech corpora in a nordic climate"
    twitter:
      creator: "@humlab"
      card: summary

development:
  mode: auto

home:
  title: "reindeer: Reproducible Analysis of Speech Corpora"
  description: >
    An R package for reproducible analysis of EMU-SDMS speech corpora.
    Provides tidyverse-friendly query and measurement workflows,
    three-level speaker metadata that drives age- and gender-aware DSP,
    and automatic generation of standards-compliant archival metadata
    (CMDI, DataCite).

authors:
  Fredrik Nylén:
    href: https://orcid.org/0000-0003-3373-0934

navbar:
  structure:
    left: [home, reference, articles, news]
    right: [ecosystem, search, github]
  components:
    home:
      icon: fas fa-home
      href: index.html
      aria-label: Home
    ecosystem:
      text: Ecosystem
      menu:
        - text: protoscribe (draft annotations)
          href: https://github.com/humlab-speech/protoscribe
        - text: erodex (parameter simulation)
          href: https://github.com/humlab-speech/erodex
        - text: superassp (signal processing)
          href: https://github.com/humlab-speech/superassp
        - text: emuR
          href: https://ips-lmu.github.io/emuR/
    news:
      text: News
      href: news/index.html
    github:
      icon: fab fa-github
      href: https://github.com/humlab-speech/reindeer
      aria-label: GitHub repository

reference:
  - title: "Open a corpus"
    desc: "Open, create and try out an EMU-SDMS corpus."
    contents:
      - corpus
      - demo_corpus
      - import_media

  - title: "Query"
    desc: "Find segments with the EMU Query Language and move around the hierarchy."
    contents:
      - query
      - scout
      - move_to
      - segment_list
      - lazy_segment_list
      - is_segment_list
      - as_segment_list

  - title: "Measure"
    desc: "Speaker-aware signal measurement and reshaping the results."
    contents:
      - quantify
      - dsp_parameters
      - pivot_tracks_longer
      - pivot_tracks_wider
      - segment_cols
      - track_cols
      - biographize

  - title: "Metadata"
    desc: "Three-level speaker and recording metadata."
    contents:
      - set_metadata
      - get_metadata
      - export_metadata

  - title: "Pipe-loss accounting"
    desc: "See which rows each step dropped."
    contents:
      - provenance
      - dropped

  - title: "Annotate"
    desc: "Edit and review in the Artic web app; exchange annotations with ELAN and Praat."
    contents:
      - annotate
      - browse_corpus_gadget
      - edit_metadata_gadget
      - read_annotations
      - write_annotations

  - title: "Describe and archive"
    desc: "README, CITATION.cff, DataCite, JSON-LD and CMDI from the corpus's metadata."
    contents:
      - describe_corpus

  - title: "Caches"
    contents:
      - clear_cache

  - title: "Data"
    contents:
      - DSPP

  - title: internal
    contents:
      - reindeer
      - reexports
      - reindeer-query-parser
      - quantify.lazy_segment_list
      - print.bundle_list
      - print.extended_segment_list
      - print.lazy_segment_list
      - print.segment_list
      - print.track_long
      - summary.extended_segment_list
      - summary.lazy_segment_list
      - summary.segment_list
      - "[<-.corpus"

articles:
  - title: "Start here"
    navbar: ~
    contents:
      - getting_started
      - querying
      - speaker_aware
  - title: "Working with a corpus"
    contents:
      - metadata
      - building_a_corpus
      - annotating
      - interoperability
      - archiving
  - title: "Coming from elsewhere"
    contents:
      - migrating
