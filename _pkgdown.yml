url: https://humlab-speech.github.io/reindeer/
lang: en

template:
  bootstrap: 5
  bootswatch: flatly
  bslib:
    primary: "#0054AD"
    border-radius: 0.5rem
    btn-border-radius: 0.25rem
  opengraph:
    twitter:
      creator: "@humlab"
      card: summary

development:
  mode: auto

home:
  title: "reindeer: Reproducible Analysis of Speech Corpora"
  description: >
    An R package for reproducible analysis of EMU-SDMS speech corpora.
    Provides tidyverse-friendly query and measurement workflows,
    three-level speaker metadata that drives age- and gender-aware DSP,
    and automatic generation of standards-compliant archival metadata
    (CMDI, DataCite).

authors:
  Fredrik Nylén:
    href: https://orcid.org/0000-0003-3373-0934

navbar:
  structure:
    left:  [home, reference, articles, news]
    right: [search, github]
  components:
    home:
      icon: fas fa-home
      href: index.html
      aria-label: Home
    reference:
      text: Reference
      href: reference/index.html
    articles:
      text: Articles
      menu:
      - text: Getting Started
        href: articles/getting_started.html
      - text: Metadata Management
        href: articles/metadata_management.html
      - text: Cache Management
        href: articles/cache_management.html
      - text: Lazy Pipelines and Pipe-Loss Debugging
        href: articles/lazy_and_provenance.html
      - text: Interactive Annotation
        href: articles/interactive_annotation.html
    news:
      text: News
      href: news/index.html
    github:
      icon: fab fa-github
      href: https://github.com/humlab-speech/reindeer
      aria-label: GitHub repository

reference:
- title: "Corpus"
  desc: "Open, describe, and validate an EMU-SDMS corpus."
  contents:
  - corpus
  - describe_corpus
  - validate_corpus
  - peek_signals
  - glimpse

- title: "Query"
  desc: "EMU Query Language and segment-list classes."
  contents:
  - query
  - segment_list
  - extended_segment_list
  - lazy_segment_list
  - is_segment_list
  - as_segment_list
  - collect

- title: "Measurement"
  desc: "DSP measurement with speaker-aware parameters."
  contents:
  - quantify
  - enrich
  - dsp_parameters

- title: "Metadata"
  desc: "Three-level speaker metadata: write, read, round-trip."
  contents:
  - set_metadata
  - get_metadata
  - load_metadata
  - export_metadata

- title: "Navigation"
  desc: "Move through the annotation hierarchy."
  contents:
  - scout
  - ascend_to
  - descend_to

- title: "Cache"
  desc: "Inspect and prune the persistent measurement cache."
  contents:
  - inspect_cache
  - manage_cache
  - check_cache_size

- title: "Provenance"
  desc: "Per-step row accounting for pipe-loss debugging."
  contents:
  - provenance
  - dropped
  - dropped_rows

- title: "Psychoacoustic helpers"
  desc: "Frequency-scale conversions used in DSP."
  contents:
