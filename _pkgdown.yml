url: https://humlab-speech.github.io/reindeer/
lang: en

template:
  bootstrap: 5
  bootswatch: flatly
  bslib:
    primary: "#0054AD"
    border-radius: 0.5rem
    btn-border-radius: 0.25rem
  opengraph:
    image:
      src: man/figures/logo.png
      alt: "reindeer: speech corpora in a nordic climate"
    twitter:
      creator: "@humlab"
      card: summary

development:
  mode: auto

home:
  title: "reindeer: Reproducible Analysis of Speech Corpora"
  description: >
    An R package for reproducible analysis of EMU-SDMS speech corpora.
    Provides tidyverse-friendly query and measurement workflows,
    three-level speaker metadata that drives age- and gender-aware DSP,
    and automatic generation of standards-compliant archival metadata
    (CMDI, DataCite).

authors:
  Fredrik Nylén:
    href: https://orcid.org/0000-0003-3373-0934

navbar:
  structure:
    left: [home, reference, articles, news]
    right: [search, github]
  components:
    home:
      icon: fas fa-home
      href: index.html
      aria-label: Home
    news:
      text: News
      href: news/index.html
    github:
      icon: fab fa-github
      href: https://github.com/humlab-speech/reindeer
      aria-label: GitHub repository

reference:
  - title: "Open a corpus"
    desc: "Open, create and try out an EMU-SDMS corpus."
    contents:
      - corpus
      - demo_corpus
      - import_media

  - title: "Query"
    desc: "Find segments with the EMU Query Language and move around the hierarchy."
    contents:
      - query
      - scout
      - move_to
      - segment_list
      - lazy_segment_list
      - is_segment_list
      - as_segment_list

  - title: "Measure"
    desc: "Speaker-aware signal measurement and reshaping the results."
    contents:
      - quantify
      - dsp_parameters
      - pivot_tracks_longer
      - pivot_tracks_wider
      - segment_cols
      - track_cols
      - biographize

  - title: "Metadata"
    desc: "Three-level speaker and recording metadata."
